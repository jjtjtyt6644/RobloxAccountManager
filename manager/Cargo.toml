[package]
name = "roblox_account_manager"
version = "1.7.0"
edition = "2021"

# IMPORTANT: do not add tao, wry, webview2-com or anything that pulls them in.
# The sign-in webview lives in ../login (ram-login.exe) so that none of its code or memory is in this process.
[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
]
